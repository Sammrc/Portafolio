<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Control & Tareas Pendientes</title>
  <style>
    /* VARIABLES DE COLOR - TEMA TECNOLÓGICO, DINÁMICO Y CÓMODO */
    :root {
      --bg-main: #0b0f19;
      --bg-card: #151c2e;
      --bg-card-hover: #1e293b;
      --border-color: #2a364f;
      --text-primary: #e2e8f0;
      --text-secondary: #94a3b8;
      --accent-cyan: #38bdf8;
      --accent-blue: #6366f1;
      --accent-gold: #f59e0b;
      --badge-bg: #1e293b;
      --badge-pending: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
      background-image: 
        radial-gradient(circle at 15% 15%, rgba(56, 189, 248, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 85% 85%, rgba(99, 102, 241, 0.08) 0%, transparent 40%);
    }

    /* CONTENEDOR PRINCIPAL */
    .container {
      width: 100%;
      max-width: 900px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 2rem;
    }

    /* HEADER Y PANEL DEL GATO */
    .hero-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      position: relative;
      overflow: hidden;
    }

    .hero-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 4px;
      background: linear-gradient(90deg, var(--accent-cyan), var(--accent-blue));
    }

    .hero-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text-primary);
      margin-top: 1rem;
      text-align: center;
      letter-spacing: 0.5px;
    }

    .hero-subtitle {
      font-size: 0.9rem;
      color: var(--text-secondary);
      margin-top: 0.25rem;
    }

    /* ANIMACIÓN Y CONTENEDOR DEL GATO SIAMÉS */
    .cat-container {
      width: 240px;
      height: 200px;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      animation: float 4s ease-in-out infinite;
    }

    /* SVG del Gato */
    .siamese-cat {
      width: 100%;
      height: 100%;
    }

    /* Animaciones CSS del gato */
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }

    .cat-tail {
      transform-origin: 160px 120px;
      animation: wagTail 2.5s ease-in-out infinite alternate;
    }

    @keyframes wagTail {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(12deg); }
    }

    .cat-ear-left, .cat-ear-right {
      transform-origin: center;
      animation: twitchEar 5s infinite;
    }

    @keyframes twitchEar {
      0%, 90%, 100% { transform: rotate(0deg); }
      92% { transform: rotate(-5deg); }
      94% { transform: rotate(3deg); }
    }

    .cat-whisker {
      stroke-dasharray: 20;
      animation: twitchWhiskers 3s infinite ease-in-out;
    }

    @keyframes twitchWhiskers {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.03); }
    }

    /* SECCIÓN DE TAREAS / TRABAJOS */
    .tasks-section {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 2rem;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
    }

    .section-title {
      font-size: 1.25rem;
      color: var(--accent-cyan);
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 0.75rem;
    }

    .task-list {
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
      list-style: none;
    }

    .task-item {
      background: var(--bg-main);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 1rem 1.25rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.2s ease;
    }

    .task-item:hover {
      background: var(--bg-card-hover);
      border-color: var(--accent-cyan);
      transform: translateX(4px);
    }

    .task-info {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .task-icon {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background-color: var(--accent-cyan);
      box-shadow: 0 0 8px var(--accent-cyan);
    }

    .task-item.pending .task-icon {
      background-color: var(--text-secondary);
      box-shadow: none;
    }

    .task-name {
      font-weight: 600;
      color: var(--text-primary);
      font-size: 0.95rem;
    }

    .task-badge {
      font-size: 0.75rem;
      padding: 0.3rem 0.75rem;
      border-radius: 20px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .badge-active {
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent-cyan);
      border: 1px solid rgba(56, 189, 248, 0.3);
    }

    .badge-pending {
      background: var(--badge-pending);
      color: var(--text-secondary);
      border: 1px solid var(--border-color);
    }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- TARJETA DEL PERSONAJE (GATO SIAMÉS CON CASCO) -->
    <div class="hero-card">
      <div class="cat-container">
        <svg class="siamese-cat" viewBox="0 0 200 180" fill="none" xmlns="http://www.w3.org/2000/svg">
          <!-- Sombra -->
          <ellipse cx="100" cy="165" rx="55" ry="8" fill="#000000" opacity="0.3"/>

          <!-- Cola -->
          <path class="cat-tail" d="M150 120 C 170 110, 180 80, 165 60 C 158 50, 145 60, 152 72 C 160 88, 150 105, 138 115" fill="#3D2b1f" stroke="#3D2b1f" stroke-width="4" stroke-linecap="round"/>

          <!-- Cuerpo (Siamés Cream/Beige) -->
          <rect x="55" y="90" width="85" height="55" rx="25" fill="#E8DEC8"/>

          <!-- Chaleco de Seguridad -->
          <rect x="70" y="90" width="55" height="55" fill="#F59E0B"/>
          <rect x="82" y="90" width="10" height="55" fill="#FFFFFF"/>
          <rect x="103" y="90" width="10" height="55" fill="#FFFFFF"/>

          <!-- Patas (Oscuras de Siamés) -->
          <rect x="62" y="130" width="14" height="28" rx="7" fill="#3D2b1f"/>
          <rect x="82" y="130" width="14" height="28" rx="7" fill="#3D2b1f"/>
          <rect x="102" y="130" width="14" height="28" rx="7" fill="#3D2b1f"/>
          <rect x="120" y="130" width="14" height="28" rx="7" fill="#3D2b1f"/>

          <!-- Cabeza (Siamés Cream) -->
          <circle cx="100" cy="75" r="38" fill="#E8DEC8"/>

          <!-- Orejas (Oscuras) -->
          <polygon class="cat-ear-left" points="70,52 60,22 82,42" fill="#3D2b1f"/>
          <polygon class="cat-ear-right" points="130,52 140,22 118,42" fill="#3D2b1f"/>

          <!-- Mancha de la Cara (Máscara Siamés) -->
          <ellipse cx="100" cy="80" rx="24" ry="18" fill="#3D2b1f"/>

          <!-- Ojos Azules Siamés -->
          <circle cx="88" cy="74" r="5.5" fill="#38BDF8"/>
          <circle cx="88" cy="74" r="2.5" fill="#0F172A"/>
          <circle cx="90" cy="72" r="1" fill="#FFFFFF"/>

          <circle cx="112" cy="74" r="5.5" fill="#38BDF8"/>
          <circle cx="112" cy="74" r="2.5" fill="#0F172A"/>
          <circle cx="114" cy="72" r="1" fill="#FFFFFF"/>

          <!-- Nariz -->
          <polygon points="97,83 103,83 100,86" fill="#1E293B"/>

          <!-- LOS 6 BIGOTES VISIBLES (3 a la izquierda, 3 a la derecha) -->
          <g class="cat-whisker" stroke="#E8DEC8" stroke-width="2" stroke-linecap="round">
            <!-- Izquierda (3) -->
            <line x1="78" y1="80" x2="52" y2="74" />
            <line x1="76" y1="84" x2="50" y2="84" />
            <line x1="78" y1="88" x2="54" y2="94" />
            
            <!-- Derecha (3) -->
            <line x1="122" y1="80" x2="148" y2="74" />
            <line x1="124" y1="84" x2="150" y2="84" />
            <line x1="122" y1="88" x2="146" y2="94" />
          </g>

          <!-- Casco de Protección -->
          <path d="M68 50 C 68 28, 132 28, 132 50 Z" fill="#F59E0B"/>
          <rect x="62" y="47" width="76" height="6" rx="3" fill="#D97706"/>
          <path d="M92 31 C 92 28, 108 28, 108 31 L 106 47 L 94 47 Z" fill="#FBBF24"/>
        </svg>
      </div>

      <h1 class="hero-title">Supervisor Siamés</h1>
      <p class="hero-subtitle">Panel de Control de Proyectos</p>
    </div>

    <!-- SECCIÓN DE TRABAJOS PENDIENTES -->
    <div class="tasks-section">
      <h2 class="section-title">
        <span>📋</span> Lista de Trabajos
      </h2>

      <ul class="task-list">
        <li class="task-item">
          <div class="task-info">
            <span class="task-icon"></span>
            <span class="task-name">Trabajo 1</span>
          </div>
          <span class="task-badge badge-active">En Proceso</span>
        </li>

        <li class="task-item pending">
          <div class="task-info">
            <span class="task-icon"></span>
            <span class="task-name">Trabajo 2 pendiente</span>
          </div>
          <span class="task-badge badge-pending">Pendiente</span>
        </li>

        <li class="task-item pending">
          <div class="task-info">
            <span class="task-icon"></span>
            <span class="task-name">Trabajo 3 pendiente</span>
          </div>
          <span class="task-badge badge-pending">Pendiente</span>
        </li>

        <li class="task-item pending">
          <div class="task-info">
            <span class="task-icon"></span>
            <span class="task-name">Trabajo 4 pendiente</span>
          </div>
          <span class="task-badge badge-pending">Pendiente</span>
        </li>

        <li class="task-item pending">
          <div class="task-info">
            <span class="task-icon"></span>
            <span class="task-name">Trabajo 5 pendiente</span>
          </div>
          <span class="task-badge badge-pending">Pendiente</span>
        </li>
      </ul>
    </div>

  </div>

</body>
</html>
